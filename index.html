<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жизнь как игра</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Жизнь-игра">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8ECF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141733" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme:light dark;
  --bg:#E8ECF6;--surface:#FFFFFF;--surface-2:#F0F2FA;--track:#DCE1F0;
  --ink:#1B2140;--ink-2:#555D84;--edge:#1B2140;
  --primary:#5B3FE0;--on-primary:#FFFFFF;
  --danger:#D6303A;--on-danger:#FFFFFF;--boss:#E5484D;--focus:#FF6B00;
  --c0:#F5A800;--c1:#EE4A86;--c2:#2EBD78;--c3:#4F83F5;--c4:#A66CFF;--c5:#FF7A3D;--c6:#12B5CB;--c7:#9BCB3B;
  --on-color:#14173A;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141733;--surface:#202552;--surface-2:#2B3169;--track:#161938;
    --ink:#F1F2FF;--ink-2:#AEB3E0;--edge:#080A1D;
    --primary:#9A8CFF;--on-primary:#0E1030;
    --danger:#FF6B72;--on-danger:#220A0D;--boss:#FF6B72;--focus:#FFD166;
  }
}

*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Nunito,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:16px;line-height:1.4;min-height:100vh;min-height:100dvh;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
ul,ol{list-style:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}

/* ---------- герой ---------- */
.hero{background:var(--surface);border:2px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--edge);padding:14px}
.hero-top{display:flex;gap:14px;align-items:center}
.shield{position:relative;width:68px;height:76px;flex:none}
.shield svg{position:absolute;inset:0;width:100%;height:100%}
.shield .n{position:absolute;inset:0 0 8px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-primary);line-height:1}
.shield b{font-size:30px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.shield b.long{font-size:23px}
.shield small{font-size:11px;font-weight:800;opacity:.9;margin-top:1px}
.hero-info{flex:1;min-width:0}
.name-btn{display:flex;align-items:center;gap:7px;max-width:100%;font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em;min-height:32px}
.name-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name-btn svg{width:15px;height:15px;flex:none;color:var(--ink-2)}
.rank{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.rank b{font-size:15px;font-weight:800;color:var(--ink)}
.xp-line{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border:2px solid var(--edge);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}

/* ---------- полоски ---------- */
.bar{display:block;position:relative;height:16px;margin-top:8px;border:2px solid var(--edge);border-radius:9px;background:var(--track);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--bar,var(--primary));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.notch::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),var(--edge) calc(10% - 2px),var(--edge) 10%)}
.bar.mini{height:10px;margin-top:6px;border-radius:6px}

/* ---------- вкладки ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 0 10px;background:var(--bg)}
.tab{min-height:44px;text-align:center;font-weight:800;font-size:15px;background:var(--surface);border:2px solid var(--edge);border-radius:12px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.tab:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}

/* ---------- общее ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-h:first-child{margin-top:8px}
.sec-h h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sec-h .meta{font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.empty{padding:18px;text-align:center;font-weight:700;color:var(--ink-2);border:2px dashed var(--edge);border-radius:14px}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;font-size:14px;font-weight:700;border:2px solid var(--edge);border-radius:12px;background:var(--surface-2);background:color-mix(in srgb,var(--c0) 35%,var(--surface))}
.notice span{flex:1 1 200px}
.banner{margin-bottom:10px;padding:12px 14px;font-weight:800;border:2px solid var(--edge);border-radius:14px;background:var(--surface-2);background:color-mix(in srgb,var(--c2) 35%,var(--surface))}
.banner.lite{background:var(--surface-2);background:color-mix(in srgb,var(--c6) 30%,var(--surface))}
.row-actions{display:flex;gap:10px;margin-top:14px}
.row-actions.center{justify-content:center}
.add-btn{flex:1;min-height:52px;text-align:center;font-weight:800;border:2px dashed var(--edge);border-radius:14px}
.add-btn:active{background:var(--surface-2)}
.row-actions .btn{min-height:52px}
.dayswitch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.dayhint{margin:-2px 2px 10px}

.btn{min-height:44px;padding:0 16px;text-align:center;font-weight:800;color:var(--on-primary);background:var(--primary);border:2px solid var(--edge);border-radius:12px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn:disabled{cursor:not-allowed;color:var(--ink-2);background:var(--surface-2);box-shadow:none;transform:translateY(3px)}
.btn.ghost{color:var(--ink);background:var(--surface)}
.btn.danger{color:var(--on-danger);background:var(--danger)}
.btn.small{min-height:40px;padding:0 12px;font-size:15px}

/* ---------- миссия недели ---------- */
.mission{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:12px;padding:10px 12px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge)}
.mission.empty-m{border-style:dashed;box-shadow:none}
.mission.done{background:var(--surface-2)}
.m-ico{flex:none;font-size:22px}
.m-body{flex:1;min-width:0;display:block}
.m-body small{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
.m-body b{display:block;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.mission.done .m-body b{text-decoration:line-through;color:var(--ink-2)}
.m-ok{flex:none;font-size:14px;font-weight:800;color:var(--ink-2)}

/* ---------- сферы ---------- */
.spheres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spheres .sphere:last-child:nth-child(odd){grid-column:1/-1}
.sphere{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.sphere:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.sphere[aria-pressed="true"]{background:var(--surface-2);background:color-mix(in srgb,var(--c) 28%,var(--surface))}
.ico{display:grid;place-items:center;width:40px;height:40px;flex:none;font-size:21px;background:var(--c);border:2px solid var(--edge);border-radius:11px}
.sphere .t{flex:1;min-width:0;display:block}
.sphere b{display:block;font-size:15px;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sphere small{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}

/* ---------- квесты ---------- */
.quests{display:grid;gap:10px}
.quest{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.quest:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.quest.editing{border-style:dashed}
.box{display:grid;place-items:center;width:34px;height:34px;flex:none;color:#14173A;background:var(--surface-2);border:2px solid var(--edge);border-radius:10px}
.box svg{width:20px;height:20px;opacity:0;transform:scale(.4)}
.quest.done{background:var(--surface-2)}
.quest.done .box{background:var(--c)}
.quest.done .box svg{opacity:1;transform:none}
.quest.pop .box{animation:thump .26s ease-out}
.quest.pop .box svg{animation:stamp .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes stamp{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes thump{50%{transform:scale(1.18)}}
.quest.editing .box svg{opacity:1;transform:none;color:var(--ink)}
.q-body{flex:1;min-width:0;display:block}
.q-name{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.quest.done .q-name{text-decoration:line-through;color:var(--ink-2)}
.q-sphere{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;margin-top:2px;font-size:13px;font-weight:700;color:var(--ink-2)}
.q-sphere i{width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--edge)}
.q-sphere em{font-style:normal}
.xp-tag{flex:none;padding:4px 10px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);background:color-mix(in srgb,var(--c,var(--primary)) 30%,var(--surface));border:2px solid var(--edge);border-radius:999px}

/* ---------- босс, испытания, магазин ---------- */
.boss{padding:18px 16px;text-align:center;background:var(--surface);border:2px solid var(--edge);border-radius:22px;box-shadow:0 4px 0 var(--edge)}
.boss-face{display:grid;place-items:center;width:104px;height:104px;margin:8px auto 12px;font-size:60px;background:var(--surface-2);background:color-mix(in srgb,var(--boss) 30%,var(--surface));border:2px solid var(--edge);border-radius:28px}
.boss h2{font-size:24px;font-weight:900;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.boss .hp{margin-top:10px;font-weight:800;font-variant-numeric:tabular-nums}
.boss .bar{height:22px;margin-top:8px;--bar:var(--boss)}
.boss .win{margin-top:8px;font-weight:700}
.boss .hint{margin-top:10px}
.hint{font-size:13px;font-weight:600;color:var(--ink-2)}
.hint.big{font-size:16px;font-weight:600;color:var(--ink)}
.chlist{display:grid;gap:12px}
.ch{display:grid;gap:8px;padding:12px;background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:0 3px 0 var(--edge)}
.ch-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ch-t{font-size:17px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.steps-l{display:grid;gap:2px}
.step{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 2px;font-weight:600;line-height:1.25}
.step .box{width:28px;height:28px;border-radius:8px}
.step .box svg{width:17px;height:17px}
.step.on .box{background:var(--c)}
.step.on .box svg{opacity:1;transform:none}
.step.on span:last-child{text-decoration:line-through;color:var(--ink-2)}
.ch .row-actions{margin-top:2px}
.ch .row-actions .btn{flex:1}
.shop{display:grid;gap:10px}
.shop-hint{margin:-2px 2px 10px}
.reward{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge)}
.r-name{flex:1;min-width:0;display:block}
.r-name b{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.r-name small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;flex:none;background:var(--surface-2);border:2px solid var(--edge);border-radius:12px}
.icon-btn.small{width:40px;height:40px}
.icon-btn svg{width:18px;height:18px}
.bought{margin-top:10px;display:grid;gap:6px}
.bought li{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;font-size:14px;font-weight:600;border-bottom:2px solid var(--track)}
.bought li span:last-child{color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- итоги ---------- */
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:176px;padding:14px 12px 10px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.col .val{min-height:14px;font-size:11px;font-weight:800;line-height:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.col .stack{display:flex;flex-direction:column-reverse;width:100%;max-width:32px;min-height:4px;overflow:hidden;background:var(--track);border:2px solid var(--edge);border-radius:8px 8px 4px 4px}
.col .seg{display:block;width:100%}
.col .d{padding:0 6px;font-size:12px;font-weight:800;line-height:18px;border-radius:6px}
.col.today .d{background:var(--primary);color:var(--on-primary)}
.wk{display:grid;gap:12px;margin-top:12px;padding:14px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.wk p{font-weight:700}
.wk p.hint{font-weight:600}
.wk-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.wk-row .nm{display:block;font-weight:700;line-height:1.1}
.wk-row b{font-weight:800;font-variant-numeric:tabular-nums}
.wk-row .bar{margin-top:5px}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{display:flex;gap:10px;align-items:center;width:100%;padding:10px;text-align:left;background:var(--surface);border:2px solid var(--edge);border-radius:14px}
.ach .ai{display:grid;place-items:center;width:40px;height:40px;flex:none;font-size:22px;background:var(--surface-2);background:color-mix(in srgb,var(--primary) 25%,var(--surface));border:2px solid var(--edge);border-radius:11px}
.ach b{display:block;font-size:14px;font-weight:800;line-height:1.15}
.ach small{display:block;margin-top:2px;font-size:12px;font-weight:600;line-height:1.2;color:var(--ink-2)}
.ach.locked{opacity:.62}
.ach.locked .ai{filter:grayscale(1)}
button.ach{cursor:pointer;border-style:dashed}
textarea,input[type="text"],input[type="number"]{width:100%;min-height:48px;padding:10px 12px;background:var(--surface-2);border:2px solid var(--edge);border-radius:12px}
textarea{min-height:104px;resize:vertical}

/* ---------- ещё ---------- */
.btn-col{display:grid;gap:10px}
.btn-col .btn{width:100%}
.steps{display:grid;gap:8px;padding-left:22px;list-style:decimal;font-weight:600}
.rules{display:grid;gap:8px;padding-left:20px;list-style:disc;font-weight:600}
.rks{display:grid;gap:6px}
.rk{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;font-weight:700;background:var(--surface-2);border:2px solid var(--edge);border-radius:10px}
.rk.on{background:var(--primary);color:var(--on-primary)}
.rk span{font-variant-numeric:tabular-nums}
.set-list{display:grid;gap:10px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.set-row:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.set-row .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-row svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.footer{margin-top:26px;text-align:center}
.footer .btn{margin-bottom:12px}

/* ---------- окна ---------- */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,10,29,.55)}
.sheet{width:100%;max-width:460px;max-height:92vh;max-height:92dvh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));background:var(--surface);border:2px solid var(--edge);border-bottom:0;border-radius:22px 22px 0 0;animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.field{display:grid;gap:6px;margin-top:14px}
.field label,.field .lbl{font-size:14px;font-weight:800;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.emo .chip{min-width:44px;justify-content:center;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;font-weight:800;background:var(--surface-2);border:2px solid var(--edge);border-radius:999px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chip.sph[aria-pressed="true"]{background:var(--c);color:var(--on-color)}
.chip.swatch{width:40px;min-width:40px;padding:0;background:var(--c)}
.chip.swatch[aria-pressed="true"]{background:var(--c);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--edge)}
.err{min-height:1.3em;margin-top:12px;font-size:14px;font-weight:700;color:var(--danger)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.sheet .extra{width:100%;margin-top:12px}
.lib-list{display:grid;gap:8px;margin-top:12px}
.lib-row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 10px;background:var(--surface-2);border:2px solid var(--edge);border-radius:12px}
.lib-row[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 3px var(--primary)}
.lib-row[aria-pressed="true"] .box{background:var(--primary);color:var(--on-primary)}
.lib-row[aria-pressed="true"] .box svg{opacity:1;transform:none}
.lib-row:disabled{opacity:.5;cursor:not-allowed}
.lib-row .lr-t{flex:1;min-width:0;display:block}
.lib-row b{display:block;font-weight:700;line-height:1.2}
.lib-row small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}

/* ---------- эффекты ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:30;max-width:min(92vw,420px);padding:12px 16px;font-weight:800;text-align:center;color:var(--bg);background:var(--ink);border:2px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edge);transform:translateX(-50%);animation:drop .25s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.fx{position:fixed;z-index:25;pointer-events:none;font-size:20px;font-weight:900;white-space:nowrap;color:var(--c);
  text-shadow:0 2px 0 var(--edge),2px 0 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge)}
.cf{position:fixed;z-index:40;width:9px;height:13px;pointer-events:none;border:1.5px solid var(--edge);border-radius:2px}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="app" id="app"><p class="empty">Загружаю игру…</p></main>
<div id="sheet"></div>
<div id="toast" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" hidden>

<script>
(function () {

const Store = {
  mode: 'memory',
  async load() {
    if (window.storage) {
      this.mode = 'claude';
      try { const r = await window.storage.get(KEY); return r && r.value ? r.value : null; } catch (e) { return null; }
    }
    try { const v = window.localStorage.getItem(KEY); this.mode = 'local'; return v; } catch (e) { this.mode = 'memory'; return null; }
  },
  async save(text) {
    if (this.mode === 'claude') { const r = await window.storage.set(KEY, text); return !!r; }
    if (this.mode === 'local') { window.localStorage.setItem(KEY, text); return true; }
    return false;
  }
};

function cleanSpheres(arr) {
  const seen = new Set(), out = [];
  arr.forEach((sp, idx) => {
    if (!sp || sp.id == null || seen.has(String(sp.id)) || out.length >= MAX_SPHERES) return;
    seen.add(String(sp.id));
    out.push({
      id: String(sp.id),
      name: String(sp.name || 'Сфера').slice(0, 14),
      icon: String(sp.icon || '⭐').slice(0, 8),
      c: Number.isInteger(sp.c) && sp.c >= 0 && sp.c < PALETTE_N ? sp.c : idx % PALETTE_N
    });
  });
  return out;
}

function normalize(o) {
  o = o && typeof o === 'object' ? o : {};

  s.v = 3;

  let sp = Array.isArray(o.spheres) ? cleanSpheres(o.spheres) : [];

  s.spheres = sp;
  const ids = new Set(sp.map(x => x.id));

  s.quests = (Array.isArray(o.quests) ? o.quests : []).filter(q => q && q.id && typeof q.name === 'string' && typeof q.xp === 'number')

  s.log = (Array.isArray(o.log) ? o.log : []).filter(e => e && typeof e.date === 'string' && typeof e.xp === 'number' && e.sphere);
  s.rewards = (Array.isArray(o.rewards) ? o.rewards : []).filter(r => r && r.id && typeof r.name === 'string' && typeof r.cost === 'number');
  s.bought = (Array.isArray(o.bought) ? o.bought : []).filter(b => b && typeof b.name === 'string' && typeof b.date === 'string');

  if (Array.isArray(o.challenges)) {
    s.challenges = o.challenges.filter(c => c && c.id && typeof c.name === 'string' && typeof c.xp === 'number').map(c => ({
      id: String(c.id), name: c.name, xp: c.xp, sphere: ids.has(c.sphere) ? c.sphere : sp[0].id,
      steps: (Array.isArray(c.steps) ? c.steps : []).filter(st => st && typeof st.t === 'string').map(st => ({ t: st.t, d: !!st.d })),
      done: typeof c.done === 'string' ? c.done : null
    }));
  } else {
    s.challenges = base.challenges.map(c => Object.assign({}, c, { sphere: ids.has(c.sphere) ? c.sphere : sp[0].id }));
  }
  s.mission = o.mission && typeof o.mission === 'object' && typeof o.mission.text === 'string'
    ? { text: o.mission.text, week: String(o.mission.week || ''), xp: Number(o.mission.xp) > 0 ? Number(o.mission.xp) : 50, done: !!o.mission.done } : null;

  return s;
}

// XP, с которого начинается уровень L (внутри ранга уровни распределены поровну)
function xpAt(L) {
  if (L <= 1) return 0;
  if (L >= CAP_LVL) return CAP_XP + (L - CAP_LVL) * 1000;
  let i = TIERS.length - 1;
  while (TIERS[i][0] > L) i--;
  const a = TIERS[i];
  const nextL = i + 1 < TIERS.length ? TIERS[i + 1][0] : CAP_LVL;
  const nextXP = i + 1 < TIERS.length ? TIERS[i + 1][1] : CAP_XP;
  return a[1] + Math.round((L - a[0]) / (nextL - a[0]) * (nextXP - a[1]));
}
function levelFromXP(xp) {
  let L = 1;
  while (xpAt(L + 1) <= xp) L++;
  return { lvl: L, into: xp - xpAt(L), need: xpAt(L + 1) - xpAt(L) };
}

  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function maxStreak() {
  const days = Array.from(new Set(state.log.map(e => e.date))).sort();

  days.forEach(d => { run = prev && dayDiff(prev, d) === 1 ? run + 1 : 1; if (run > best) best = run; prev = d; });
  return best;
}

function checkAch(silent) {
  const got = [];
  ACH.forEach(a => { if (!a.manual && !state.ach[a.id] && a.ok()) { state.ach[a.id] = todayStr(); got.push(a); } });
  if (!got.length) return;
  if (!silent) got.forEach(a => toast(a.icon + ' Достижение: ' + a.name));
  persist();
}

/* ================= сохранение ================= */
let saveTimer = null;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 120); }
async function doSave() {
  saveTimer = null;
  let ok = false;
  try { ok = await Store.save(JSON.stringify(state)); } catch (e) { ok = false; }
  if (ok !== saved) {
    const wasFalse = saved === false;
    saved = ok;
    if (!ok || wasFalse) render();
  }
}

/* ================= отрисовка ================= */
function bar(key, pct, cls, style) {
  let from = prevBar[key] == null ? 0 : prevBar[key];
  if (from > pct) from = 0;
  return '<span class="bar ' + (cls || '') + '" style="' + (style || '') + '"><i class="fill" data-key="' + key + '" data-to="' + pct + '" style="width:' + from + '%"></i></span>';
}
function settleBars() {
  void app.offsetWidth;
  app.querySelectorAll('.fill').forEach(el => {
    const to = Number(el.dataset.to);
    el.style.width = to + '%';
    prevBar[el.dataset.key] = to;
  });
}

function questsHTML() {
  const date = curDate();
  const done = doneOn(date);
  const lite = isLite(date);
  const pool = ui.edit ? state.quests : questsFor(date);
  const list = pool.filter(q => !ui.filter || q.sphere === ui.filter);
  const total = pool.length;
  const doneN = pool.filter(q => done.has(q.id)).length;
  const allDone = !ui.edit && total > 0 && doneN === total;
  const hidden = state.quests.length - pool.length;
  let body;
  if (list.length) body = '<ul class="quests">' + list.map(q => questHTML(q, done.has(q.id))).join('') + '</ul>';
  else if (lite && !ui.edit) body = '<p class="empty">В лёгком дне остаются квесты с отметкой «Минимум дня». Отметь самые важные через «Изменить».</p>';
  else body = '<p class="empty">' + (state.quests.length ? 'В этой сфере пока нет квестов. Добавь первый.' : 'Квестов нет. Добавь то, что точно сделаешь сегодня.') + '</p>';
  const ctl = '<div class="dayswitch" role="group" aria-label="День и режим">' +
    '<button class="chip" data-act="day" data-id="0" data-fid="day-0" aria-pressed="' + (ui.day === 0) + '">Сегодня</button>' +
    '<button class="chip" data-act="day" data-id="1" data-fid="day-1" aria-pressed="' + (ui.day === 1) + '">Вчера</button>' +
    '<button class="chip" data-act="lite" data-fid="lite" aria-pressed="' + lite + '">🌿 Лёгкий день</button></div>';
  return missionHTML() +
    '<div class="spheres" role="group" aria-label="Сферы жизни">' + SPHERES.map(sphereHTML).join('') + '</div>' +
    '<div class="sec-h"><h2>Квест дня № ' + dayNo(date) + '</h2><span class="meta">' + doneN + ' из ' + total + '</span></div>' +
    ctl +
    (ui.day ? '<p class="hint dayhint">Забыл отметить вчера? Закрой здесь то, что сделал: XP и серия засчитаются.</p>' : '') +
    (lite ? '<div class="banner lite">🌿 Лёгкий день: только главное. Серия не прервётся, если закроешь хотя бы один квест.</div>' : '') +
    (allDone ? '<div class="banner">🏆 ' + (ui.day ? 'Вчерашний день зачищен.' : 'День зачищен. Завтра квесты вернутся.') + '</div>' : '') +
    body +
    (lite && hidden > 0 && !ui.edit ? '<p class="hint" style="margin-top:10px">Скрыто квестов: ' + hidden + '. Они вернутся в обычный день.</p>' : '') +
    '<div class="row-actions">' +
      '<button class="add-btn" data-act="add-quest" data-fid="add-quest">+ Новый квест</button>' +
      '<button class="btn ghost" data-act="toggle-edit" data-fid="toggle-edit" aria-pressed="' + ui.edit + '">' + (ui.edit ? 'Готово' : 'Изменить') + '</button>' +
    '</div>';
}

function weekHTML() {
  const base = new Date(); base.setHours(12, 0, 0, 0);
  const rows = [], idx = {};
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base); d.setDate(base.getDate() - i);
    const r = { d, key: ymd(d), by: {}, sum: 0 };
    rows.push(r); idx[r.key] = r;
  }
  state.log.forEach(e => { const r = idx[e.date]; if (r) { r.by[e.sphere] = (r.by[e.sphere] || 0) + e.xp; r.sum += e.xp; } });
  const max = Math.max(50, ...rows.map(r => r.sum));
  const weekXP = rows.reduce((s, r) => s + r.sum, 0);
  const active = rows.filter(r => r.sum > 0).length;
  const per = SPHERES.map(s => ({ s, xp: rows.reduce((a, r) => a + (r.by[s.id] || 0), 0) }));
  const top = per.reduce((a, b) => (b.xp > a.xp ? b : a));
  const low = per.reduce((a, b) => (b.xp < a.xp ? b : a));
  const pmax = Math.max(1, top.xp);

  const chart = '<div class="chart" role="img" aria-label="XP по дням за последние 7 дней">' + rows.map((r, i) => {
    const h = r.sum ? Math.max(10, Math.round(r.sum / max * 100)) : 4;
    const known = SPHERES.reduce((a, s) => a + (r.by[s.id] || 0), 0);
    const segs = SPHERES.filter(s => r.by[s.id]).map(s => '<i class="seg" style="flex:' + r.by[s.id] + ' 1 0%;background:var(' + s.v + ')"></i>').join('') +
      (r.sum > known ? '<i class="seg" style="flex:' + (r.sum - known) + ' 1 0%;background:var(--ink-2)"></i>' : '');
    return '<div class="col' + (i === 6 ? ' today' : '') + '"><span class="val">' + (r.sum || '') + '</span><span class="stack" style="height:' + h + 'px">' + segs + '</span><span class="d">' + DAYS[r.d.getDay()] + '</span></div>';
  }).join('') + '</div>';

  const sphRows = per.map(p =>
    '<div class="wk-row"><span aria-hidden="true">' + si(p.s) + '</span>' +
    '<div><span class="nm">' + sn(p.s) + '</span>' + bar('wk-' + p.s.id, Math.round(p.xp / pmax * 100), 'mini', '--bar:var(' + p.s.v + ')') + '</div>' +
    '<b>' + p.xp + '</b></div>').join('');

  const verdict = (weekXP > 0 && top.xp !== low.xp)
    ? '<p>Сильнее всего: ' + si(top.s) + ' ' + sn(top.s) + '. Просела: ' + si(low.s) + ' ' + sn(low.s) + '.</p>'
    : (weekXP === 0 ? '<p>Пока пусто. Закрой первый квест, и здесь появятся итоги.</p>' : '');

  return '<div class="sec-h"><h2>Последние 7 дней</h2><span class="meta">' + weekXP + ' XP</span></div>' + chart +
    '<div class="wk"><p>Дней с квестами: ' + active + ' из 7</p>' + sphRows + verdict + '</div>' +
    achHTML() +
    '<div class="sec-h"><h2 id="note-h">Что поменять</h2></div>' +
    '<textarea id="note" data-fid="note" rows="4" maxlength="600" aria-labelledby="note-h" placeholder="Что сработало, где провал, что упростить на следующей неделе">' + esc(state.note) + '</textarea>';
}

/* ================= эффекты ================= */
const toastQ = [];
let toastBusy = false;
function toast(msg) { toastQ.push(msg); if (!toastBusy) nextToast(); }
function nextToast() {
  const m = toastQ.shift();
  if (m == null) { toastBusy = false; toastEl.innerHTML = ''; return; }
  toastBusy = true;
  toastEl.innerHTML = '<div class="toast">' + esc(m) + '</div>';
  setTimeout(nextToast, 2800);
}
function haptic() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* не страшно */ } }

function floatXP(rect, xp, cssVar) {
  if (calm || !rect) return;
  const f = document.createElement('div');
  f.className = 'fx';
  f.textContent = '+' + xp + ' XP';
  f.style.left = (rect.left + rect.width / 2) + 'px';
  f.style.top = rect.top + 'px';
  f.style.setProperty('--c', 'var(' + cssVar + ')');
  document.body.appendChild(f);
  const an = f.animate([
    { transform: 'translate(-50%,0) scale(.7)', opacity: 0 },
    { transform: 'translate(-50%,-22px) scale(1.15)', opacity: 1, offset: 0.25 },
    { transform: 'translate(-50%,-64px) scale(1)', opacity: 0 }
  ], { duration: 950, easing: 'ease-out' });
  an.onfinish = () => f.remove();
}

function confetti() {
  if (calm) return;
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--c0', '--c1', '--c2', '--c3', '--c4', '--primary'].map(v => cs.getPropertyValue(v).trim());
  const W = window.innerWidth;
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('i');
    p.className = 'cf';
    p.style.left = (W / 2) + 'px';
    p.style.top = '110px';
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    const dx = (Math.random() - 0.5) * W * 0.9;
    const dy = 140 + Math.random() * 280;
    const rot = Math.random() * 720 - 360;
    const an = p.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg)', opacity: 0 }
    ], { duration: 900 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.3,1)' });
    an.onfinish = () => p.remove();
  }
}

/* ================= действия ================= */
function snap(sphereId, date) {
  const done = doneOn(date), qs = questsFor(date), H = heroInfo();
  return {
    lvl: H.lvl, rank: H.rank,
    sph: sphInfo(sphereXP(sphereId)).lvl,
    dmg: bossDamage(),
    all: qs.length > 0 && qs.every(q => done.has(q.id))
  };
}

// Собирает радостные сообщения после получения XP: ранг, уровень, босс месяца, сфера, зачищенный день
function celebrate(b, a, sph) {
  const msgs = [];
  let conf = false;
  const hp = state.boss.hp;
  if (a.rank > b.rank) { msgs.push('Новый ранг: ' + TIERS[a.rank][2] + '! Уровень ' + a.lvl); conf = true; }
  else if (a.lvl > b.lvl) { msgs.push('Новый уровень: ' + a.lvl + '. Ранг: ' + TIERS[a.rank][2]); conf = true; }
  if (b.dmg < hp && a.dmg >= hp) { state.flags.boss = true; msgs.push('Босс месяца «' + state.boss.name + '» повержен! Забирай награду.'); conf = true; }
  if (sph && a.sph > b.sph) msgs.push(sph.icon + ' ' + sph.name + ': уровень ' + a.sph + '!');
  if (!b.all && a.all) { state.flags.clean = true; msgs.push('🏆 День зачищен. Все квесты закрыты!'); conf = true; }
  msgs.forEach(toast);
  if (conf) confetti();
}

function toggleQuest(id, rect) {
  const q = state.quests.find(x => x.id === id);
  if (!q) return;
  const date = curDate();
  const i = state.log.findIndex(e => e.date === date && e.questId === id);
  if (i >= 0) {
    state.log.splice(i, 1);
    render(); persist();
    return;
  }
  const sph = S[q.sphere] || SPHERES[0];
  const before = snap(sph.id, date);
  state.log.push({ id: uid(), date, questId: id, sphere: sph.id, xp: q.xp, name: q.name, tag: q.tag || '' });
  const after = snap(sph.id, date);
  floatXP(rect, q.xp, sph.v);
  haptic();
  justDone = id;
  celebrate(before, after, sph);
  render(); persist();
  checkAch();
}

function toggleStep(id, i) {
  const c = state.challenges.find(x => x.id === id);
  if (!c || c.done || !c.steps[i]) return;
  c.steps[i].d = !c.steps[i].d;
  render(); persist();
}

function defeatChallenge(id) {
  const c = state.challenges.find(x => x.id === id);
  if (!c || c.done) return;
  if (c.steps.length && !c.steps.every(s => s.d)) return;
  const sph = S[c.sphere] || SPHERES[0];
  const date = todayStr();
  const before = snap(sph.id, date);
  c.done = date;
  state.log.push({ id: uid(), date, questId: 'ch:' + c.id, sphere: sph.id, xp: c.xp, name: 'Босс: ' + c.name, bonus: true });
  state.flags.challenge = true;
  if (c.xp >= 100) state.flags.hard = true;
  const after = snap(sph.id, date);
  toast('👊 Босс «' + c.name + '» повержен! +' + c.xp + ' XP');
  confetti();
  celebrate(before, after, sph);
  render(); persist();
  checkAch();
}

function completeMission() {
  const m = state.mission;
  if (!m || m.week !== weekKey() || m.done) return;
  const sph = sphereByKind('disc');
  const date = todayStr();
  const before = snap(sph.id, date);
  m.done = true;
  state.log.push({ id: uid(), date, questId: 'ms:' + m.week, sphere: sph.id, xp: m.xp, name: 'Миссия недели: ' + m.text, bonus: true });
  const after = snap(sph.id, date);
  toast('🎯 Миссия недели выполнена! +' + m.xp + ' XP');
  confetti();
  celebrate(before, after, sph);
  render(); persist();
  checkAch();
}

function buy(id) {
  const r = state.rewards.find(x => x.id === id);
  if (!r || coins() < r.cost) return;
  state.spent += r.cost;
  state.bought.unshift({ name: r.name, cost: r.cost, date: todayStr() });
  state.bought = state.bought.slice(0, 20);
  render(); persist();
  toast('Награда твоя: ' + r.name + '. Наслаждайся!');
  confetti();
  checkAch();
}

/* ================= копия прогресса ================= */
const backupText = () => JSON.stringify({ app: 'life-rpg', v: 3, exported: new Date().toISOString(), data: state });
function markBackup() { state.lastBackup = new Date().toISOString(); render(); persist(); }

async function exportBackup() {
  const payload = backupText();
  const name = 'life-rpg-' + todayStr() + '.json';
  try {
    const file = new File([payload], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Копия прогресса' });
      markBackup();
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // человек закрыл окно «Поделиться»
  }
  // В режиме приложения скачивание по ссылке может увести с экрана игры, поэтому показываем код.
  if (!isStandalone()) {
    try {
      const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      markBackup();
      toast('Файл с копией скачан');
      return;
    } catch (e) { /* пробуем показать код */ }
  }
  codeSheet(payload);
}

async function copyBackup() {
  const text = backupText();
  try {
    await navigator.clipboard.writeText(text);
    markBackup();
    toast('Код скопирован. Вставь его в заметки или отправь себе.');
  } catch (e) { codeSheet(text); }
}

function parseBackup(text) {
  let o;
  try { o = JSON.parse(String(text).trim()); } catch (e) { return null; }
  if (o && o.app === 'life-rpg' && o.data) o = o.data;
  if (!o || !Array.isArray(o.quests) || !Array.isArray(o.log)) return null;
  return o;
}

function importPrompt(text) {
  const o = parseBackup(text);
  if (!o) { toast('Это не похоже на копию игры'); return; }
  const s = normalize(o);
  const xp = s.log.reduce((a, e) => a + e.xp, 0);
  openSheet(sheetHTML('Восстановить прогресс?',
    '<p class="hint big" style="margin-top:12px">В копии: уровень ' + levelFromXP(xp).lvl + ', ' + xp + ' XP, квестов: ' + s.quests.length + '. Текущий прогресс на этом устройстве будет заменён.</p>',
    '<button class="btn ghost" data-act="close">Отмена</button><button class="btn danger" data-act="s-save">Заменить</button>'), {
    save() {
      state = s; applySpheres();
      ui.filter = null; ui.edit = false; ui.day = 0;
      Object.keys(prevBar).forEach(k => { delete prevBar[k]; });
      closeSheet(); render(); persist();
      toast('Прогресс восстановлен');
    }
  });
}

/* ================= окна ================= */
let cur = {};
let openerFid = null;
const val = sel => sheetEl.querySelector(sel).value;

function sheetHTML(title, body, actions) {

function openSheet(html, handlers) {

}
function closeSheet() {
  sheetEl.innerHTML = '';
  cur = {};
  if (openerFid) {
    const el = app.querySelector('[data-fid="' + openerFid + '"]');
    if (el) el.focus({ preventScroll: true });

}
function field(id, label, inner, hint) {
  return '<div class="field"><label for="' + id + '">' + label + '</label>' + inner + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
}
function chipGroup(label, chips, hint) {
  return '<div class="field"><span class="lbl">' + label + '</span><div class="chips">' + chips + '</div>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
}
const sphereChips = sel => SPHERES.map(s => '<button type="button" class="chip sph" style="--c:var(' + s.v + ')" data-act="chip" data-g="sphere" data-v="' + s.id + '" aria-pressed="' + (s.id === sel) + '">' + si(s) + ' ' + sn(s) + '</button>').join('');
const xpChips = (list, sel) => list.map(n => '<button type="button" class="chip" data-act="chip" data-g="xp" data-v="' + n + '" aria-pressed="' + (n === sel) + '">' + tier(n) + ' +' + n + '</button>').join('');

function questSheet(id) {
  const q = id ? state.quests.find(x => x.id === id) : null;
  if (id && !q) return;
  let sphere = q && S[q.sphere] ? q.sphere : (ui.filter && S[ui.filter] ? ui.filter : SPHERES[0].id);
  let xp = q ? q.xp : 20;
  let core = q ? !!q.core : false;
  const choices = XP_CHOICES.indexOf(xp) >= 0 ? XP_CHOICES : XP_CHOICES.concat([xp]).sort((a, b) => a - b);
  const body =
    (q ? '' : '<button type="button" class="btn ghost small extra" data-act="extra">Выбрать из готовых квестов</button>') +
    field('f-name', 'Что нужно сделать', '<input id="f-name" type="text" maxlength="60" autocomplete="off" placeholder="Например: 20 отжиманий" value="' + esc(q ? q.name : '') + '">') +
    chipGroup('Сфера', sphereChips(sphere)) +
    chipGroup('Сложность и награда', xpChips(choices, xp), '🟢 лёгкое 5–10 XP, 🟡 среднее 15–30 XP, 🔴 сложное от 40 XP.') +
    '<div class="field"><span class="lbl">Лёгкий день</span><div class="chips"><button type="button" class="chip" data-act="tgl" data-g="core" aria-pressed="' + core + '">★ Минимум дня</button></div>' +
    '<span class="hint">Такие квесты остаются в режиме «Лёгкий день», когда мало сил.</span></div>';
  openSheet(sheetHTML(q ? 'Изменить квест' : 'Новый квест', body,
    (q ? '<button class="btn danger" data-act="s-del">Удалить</button>' : '') + '<button class="btn" data-act="s-save">Сохранить</button>'), {
    chip(g, v) { if (g === 'sphere') sphere = v; else xp = Number(v); },
    tgl(g, on) { if (g === 'core') core = on; },
    extra() { closeSheet(); libSheet('q'); },
    save() {
      const name = val('#f-name').trim();
      if (!name) return err('Напиши, что нужно сделать.');
      if (q) { q.name = name; q.sphere = sphere; q.xp = xp; q.core = core; }
      else state.quests.push({ id: uid(), sphere, name, xp, tag: '', core });
      closeSheet(); render(); persist();
    },
    del() {
      state.quests = state.quests.filter(x => x.id !== q.id);
      closeSheet(); render(); persist();
    }
  });
}

function libSheet(kind) {
  const items = kind === 'q' ? QLIB : CLIB;
  const have = n => (kind === 'q' ? state.quests.some(q => q.name === n) : state.challenges.some(c => c.name === n && !c.done));
  const sel = new Set();
  const rows = items.map((it, i) => {
    const sp = sphereByKind(it.kind);
    const exists = have(it.name);
    return '<button type="button" class="lib-row" data-act="tgl" data-g="lib" data-v="' + i + '" aria-pressed="false"' + (exists ? ' disabled' : '') + '>' +
      '<span class="box" aria-hidden="true">' + CHECK + '</span>' +
      '<span class="lr-t"><b>' + esc(it.name) + '</b><small>' + si(sp) + ' ' + sn(sp) + (exists ? ', уже есть' : (it.steps && it.steps.length ? ', условий: ' + it.steps.length : '')) + '</small></span>' +
      '<span class="xp-tag">' + tier(it.xp) + ' +' + it.xp + '</span></button>';
  }).join('');
  const hint = kind === 'q' ? 'Отметь, что добавить. Сферу можно поменять потом.' : 'Отметь боссов, которых хочешь взять. Условия победы и награду можно поменять потом.';
  openSheet(sheetHTML(kind === 'q' ? 'Готовые квесты' : 'Готовые боссы',
    '<p class="hint" style="margin-top:8px">' + hint + '</p><div class="lib-list">' + rows + '</div>',
    '<button class="btn" data-act="s-save" id="lib-save" disabled>Добавить выбранные</button>'), {
    tgl(g, on, v) {
      if (g !== 'lib') return;
      if (on) sel.add(Number(v)); else sel.delete(Number(v));
      const b = sheetEl.querySelector('#lib-save');
      if (b) { b.disabled = sel.size === 0; b.textContent = sel.size ? 'Добавить: ' + sel.size : 'Добавить выбранные'; }
    },
    save() {
      if (!sel.size) return err('Отметь хотя бы один пункт.');
      let n = 0;
      Array.from(sel).sort((a, b) => a - b).forEach(i => {
        const it = items[i];
        if (!it || have(it.name)) return;
        const sp = sphereByKind(it.kind);
        if (kind === 'q') state.quests.push({ id: uid(), sphere: sp.id, name: it.name, xp: it.xp, tag: it.tag || '', core: false });
        else state.challenges.push({ id: uid(), name: it.name, xp: it.xp, sphere: sp.id, steps: it.steps.map(t => ({ t, d: false })), done: null });
        n++;
      });
      closeSheet(); render(); persist();
      toast('Добавлено: ' + n);
    }
  });
}

function sphereSheet(id) {
  const ex = id ? S[id] : null;
  if (id && !ex) return;
  const used = new Set(SPHERES.map(s => s.c));
  let color = ex ? ex.c : [0, 1, 2, 3, 4, 5, 6, 7].filter(n => !used.has(n))[0];
  if (color == null) color = 0;
  let armed = false;
  const ICONS = ['💼', '💰', '🎬', '📱', '💪', '🏃', '🧠', '📚', '❤️', '🎯', '🌱', '🎨'];
  const swatches = [0, 1, 2, 3, 4, 5, 6, 7].map(n => '<button type="button" class="chip swatch" style="--c:var(--c' + n + ')" data-act="chip" data-g="color" data-v="' + n + '" aria-pressed="' + (n === color) + '" aria-label="Цвет ' + (n + 1) + '"></button>').join('');

      }

      applySpheres();
      state.challenges.forEach(c => { if (c.sphere === id) c.sphere = SPHERES[0].id; });
      if (ui.filter === id) ui.filter = null;
      closeSheet(); render(); persist();
    }
  });
}

    chipGroup('Сфера', sphereChips(sphere)) +
    chipGroup('Награда за победу', xpChips(choices, xp)) +
    field('f-steps', 'Условия победы (по одному в строке, необязательно)', '<textarea id="f-steps" rows="4" placeholder="Выбрать одну важную задачу&#10;Работать над ней 45 минут&#10;Получить результат">' + esc(c ? c.steps.map(s => s.t).join('\n') : '') + '</textarea>', 'Босса можно победить, когда выполнены все условия. До 8 условий.');
  openSheet(sheetHTML(c ? 'Изменить босса' : 'Новый босс', body,
    (c ? '<button class="btn danger" data-act="s-del">Удалить</button>' : '') + '<button class="btn" data-act="s-save">Сохранить</button>'), {
    chip(g, v) { if (g === 'sphere') sphere = v; else xp = Number(v); },
    extra() { closeSheet(); libSheet('ch'); },
    save() {
      const name = val('#f-name').trim();
      if (!name) return err('Назови босса.');
      const lines = val('#f-steps').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8).map(x => x.slice(0, 80));
      const old = {};
      if (c) c.steps.forEach(s => { old[s.t] = s.d; });
      const steps = lines.map(t => ({ t, d: !!old[t] }));
      if (c) { c.name = name; c.sphere = sphere; c.xp = xp; c.steps = steps; }
      else state.challenges.push({ id: uid(), name, xp, sphere, steps, done: null });
      closeSheet(); render(); persist();
    },
    del() {
      state.challenges = state.challenges.filter(x => x.id !== c.id);
      closeSheet(); render(); persist();
    }
  });
}

function missionSheet() {
  const m = state.mission && state.mission.week === weekKey() ? state.mission : null;
  let xp = m ? m.xp : 50;
  const body =
    field('f-name', 'Главная миссия на эту неделю', '<input id="f-name" type="text" maxlength="80" autocomplete="off" placeholder="Например: закрыть один тендер" value="' + esc(m ? m.text : '') + '">') +
    (m && m.done ? '' : chipGroup('Награда за выполнение', xpChips(MS_XP, xp)));
  openSheet(sheetHTML(m ? 'Изменить миссию' : 'Миссия недели', body, '<button class="btn" data-act="s-save">Сохранить</button>'), {
    chip(g, v) { xp = Number(v); },
    save() {
      const text = val('#f-name').trim();
      if (!text) return err('Напиши, что главное на этой неделе.');
      if (m) { m.text = text; if (!m.done) m.xp = xp; }
      else state.mission = { text, week: weekKey(), xp, done: false };
      closeSheet(); render(); persist();
    }
  });
}

function claimSheet(id) {
  const a = ACH.find(x => x.id === id);
  if (!a) return;
  openSheet(sheetHTML(esc(a.name),
    '<p class="hint big" style="margin-top:12px">' + esc(a.desc) + '. Отмечай, когда это действительно произошло: опыт даётся за реальные результаты.</p>',
    '<button class="btn ghost" data-act="close">Ещё нет</button><button class="btn" data-act="s-save">Да, получилось</button>'), {
    save() {
      state.ach[id] = todayStr();
      closeSheet(); render(); persist();
      toast(a.icon + ' Достижение: ' + a.name);
      confetti();
    }
  });
}

function bossSheet() {
  const b = state.boss;
  const dead = b.hp - bossDamage() <= 0;
  const body =
    field('f-name', 'Как зовут босса месяца', '<input id="f-name" type="text" maxlength="40" autocomplete="off" placeholder="Например: Лень" value="' + esc(b.name) + '">') +
    field('f-hp', 'Сколько XP нужно набрать', '<input id="f-hp" type="number" inputmode="numeric" min="100" max="100000" step="100" value="' + b.hp + '">', 'На месяц хватит 2000 до 3000 XP.') +
    field('f-reward', 'Награда за победу (необязательно)', '<input id="f-reward" type="text" maxlength="60" autocomplete="off" placeholder="Например: поездка на выходные" value="' + esc(b.reward || '') + '">');
  openSheet(sheetHTML(dead ? 'Новый босс месяца' : 'Изменить босса месяца', body, '<button class="btn" data-act="s-save">' + (dead ? 'Начать бой' : 'Сохранить') + '</button>'), {
    save() {
      const name = val('#f-name').trim();
      const hp = Math.round(Number(val('#f-hp')));
      if (!name) return err('Назови босса, например «Лень» или «Хаос в делах».');
      if (!(hp >= 100 && hp <= 100000)) return err('HP босса: число от 100 до 100000.');
      state.boss.name = name; state.boss.hp = hp; state.boss.reward = val('#f-reward').trim();
      if (dead) state.boss.startXP = totalXP();
      closeSheet(); render(); persist();
    }
  });
}

function rewardSheet(id) {
  const r = id ? state.rewards.find(x => x.id === id) : null;
  if (id && !r) return;
  const body =
    field('f-name', 'Чем будешь баловать себя', '<input id="f-name" type="text" maxlength="60" autocomplete="off" placeholder="Например: поход в кафе" value="' + esc(r ? r.name : '') + '">') +
    field('f-cost', 'Цена в монетах', '<input id="f-cost" type="number" inputmode="numeric" min="10" max="100000" step="10" value="' + (r ? r.cost : 300) + '">', '1 XP даёт 1 монету. Мелочь стоит 100 до 300, большая награда 1000 и выше.');
  openSheet(sheetHTML(r ? 'Изменить награду' : 'Новая награда', body,
    (r ? '<button class="btn danger" data-act="s-del">Удалить</button>' : '') + '<button class="btn" data-act="s-save">Сохранить</button>'), {
    save() {
      const name = val('#f-name').trim();
      const cost = Math.round(Number(val('#f-cost')));
      if (!name) return err('Напиши, что это за награда.');
      if (!(cost >= 10 && cost <= 100000)) return err('Цена: число от 10 до 100000.');
      if (r) { r.name = name; r.cost = cost; }
      else state.rewards.push({ id: uid(), name, cost });
      closeSheet(); render(); persist();
    },
    del() {
      state.rewards = state.rewards.filter(x => x.id !== r.id);
      closeSheet(); render(); persist();
    }
  });
}

function nameSheet() {
  const body = field('f-name', 'Имя героя', '<input id="f-name" type="text" maxlength="20" autocomplete="off" value="' + esc(state.name) + '">');
  openSheet(sheetHTML('Имя героя', body, '<button class="btn" data-act="s-save">Сохранить</button>'), {
    save() {
      state.name = val('#f-name').trim() || 'Герой';
      closeSheet(); render(); persist();
    }
  });
}

function codeSheet(text) {
  openSheet(sheetHTML('Код копии',
    '<div class="field"><label for="f-code">Выдели весь текст, скопируй и сохрани, например, в заметки</label><textarea id="f-code" readonly rows="6">' + esc(text) + '</textarea></div>',
    '<button class="btn" data-act="s-save">Выделить и скопировать</button>'), {
    save() {
      const t = sheetEl.querySelector('#f-code');
      t.focus(); t.select(); if (t.setSelectionRange) t.setSelectionRange(0, t.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) { closeSheet(); markBackup(); toast('Скопировано'); }
      else err('Нажми на текст и удерживай, затем выбери «Скопировать».');
    }
  });
}

function importCodeSheet() {
  openSheet(sheetHTML('Восстановить из кода',
    '<div class="field"><label for="f-code">Вставь сюда код копии</label><textarea id="f-code" rows="6" placeholder="Длинный текст, который начинается с {"></textarea></div>',
    '<button class="btn" data-act="s-save">Проверить</button>'), {
    save() {
      const text = val('#f-code');
      if (!parseBackup(text)) return err('Не похоже на код копии. Скопируй его целиком, от первой до последней буквы.');
      closeSheet();
      importPrompt(text);
    }
  });
}

function resetSheet() {
  openSheet(sheetHTML('Сбросить прогресс?',
    '<p class="hint big" style="margin-top:12px">Прогресс, квесты и награды удалятся, игра начнётся заново. Отменить это нельзя. Если сомневаешься, сначала сделай копию.</p>',
    '<button class="btn ghost" data-act="close">Отмена</button><button class="btn danger" data-act="s-save">Сбросить всё</button>'), {
    save() {
      state = fresh(); applySpheres();
      ui.tab = 'quests'; ui.filter = null; ui.edit = false; ui.day = 0;
      Object.keys(prevBar).forEach(k => { delete prevBar[k]; });
      closeSheet(); render(); persist();
    }
  });
}

/* ================= события ================= */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !state) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'tab': ui.tab = id; render(); break;
    case 'day': ui.day = id === '1' ? 1 : 0; render(); break;
    case 'lite': { const d = curDate(); if (state.lite[d]) delete state.lite[d]; else state.lite[d] = true; render(); persist(); break; }
    case 'filter': ui.filter = ui.filter === id ? null : id; render(); break;
    case 'toggle': { const box = el.querySelector('.box'); toggleQuest(id, box ? box.getBoundingClientRect() : null); break; }
    case 'toggle-edit': ui.edit = !ui.edit; render(); break;
    case 'add-quest': questSheet(null); break;
    case 'edit-quest': questSheet(id); break;
    case 'mission-edit': missionSheet(); break;
    case 'mission-done': completeMission(); break;
    case 'add-ch': chSheet(null); break;
    case 'edit-ch': chSheet(id); break;
    case 'lib-ch': libSheet('ch'); break;
    case 'step': toggleStep(id, Number(el.dataset.i)); break;
    case 'defeat': defeatChallenge(id); break;
    case 'claim': claimSheet(id); break;
    case 'edit-boss': bossSheet(); break;
    case 'add-reward': rewardSheet(null); break;
    case 'edit-reward': rewardSheet(id); break;
    case 'add-sphere': sphereSheet(null); break;
    case 'edit-sphere': sphereSheet(id); break;
    case 'buy': buy(id); break;
    case 'hero-name': nameSheet(); break;
    case 'export': exportBackup(); break;
    case 'copy-code': copyBackup(); break;
    case 'import-file': fileIn.value = ''; fileIn.click(); break;
    case 'import-code': importCodeSheet(); break;
    case 'reset': resetSheet(); break;
  }
});

app.addEventListener('input', e => {
  if (e.target && e.target.id === 'note') { state.note = e.target.value; persist(); }
});

fileIn.addEventListener('change', async () => {
  const f = fileIn.files && fileIn.files[0];
  if (!f) return;
  try { importPrompt(await f.text()); } catch (e) { toast('Не получилось прочитать файл'); }
});

sheetEl.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('scrim')) { closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'close') closeSheet();
  else if (a === 's-save') { if (cur.save) cur.save(); }
  else if (a === 's-del') { if (cur.del) cur.del(); }
  else if (a === 'extra') { if (cur.extra) cur.extra(); }
  else if (a === 'chip') {
    if (cur.chip) cur.chip(el.dataset.g, el.dataset.v);
    el.parentElement.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === el)));
  }
  else if (a === 'tgl') {
    const on = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', String(on));
    if (cur.tgl) cur.tgl(el.dataset.g, on, el.dataset.v);
  }
});

sheetEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); if (cur.save) cur.save(); }
});

document.addEventListener('keydown', e => {
  if (!sheetEl.firstChild) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = Array.prototype.slice.call(sheetEl.querySelectorAll('button,input,textarea')).filter(x => !x.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function checkDay() {
  const t = todayStr();
  if (t !== lastDay) { lastDay = t; render(); }
}
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (saveTimer) { clearTimeout(saveTimer); doSave(); } }
  else checkDay();
});

/* ================= запуск ================= */
async function init() {
  const text = await Store.load();
  let loaded = null;
  if (text) {
    try {
      const o = JSON.parse(text);
      if (o && Array.isArray(o.quests) && Array.isArray(o.log)) loaded = o;
    } catch (e) { /* битое сохранение: начинаем заново */ }
  }
  if (Store.mode === 'memory') saved = false;
  state = loaded ? normalize(loaded) : fresh();
  applySpheres();
  checkAch(true);
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* не страшно */ }
}
init();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
